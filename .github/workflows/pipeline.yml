name: Crypto Screening Pipeline

on:
  schedule:
    # Tous les jours à 7h00 UTC (9h00 Paris heure d'été)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04   # figé : ubuntu-latest migre vers Ubuntu 26 (annonce GitHub, oct. 2026)
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5   # v5+ tourne sous Node 24 (Node 20 déprécié)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6   # v6+ tourne sous Node 24
        with:
          python-version: '3.11'

      - name: Install dependencies (modèle appris 06b_ml_score)
        run: pip install -r requirements.txt

      - name: Run pipeline complet
        run: |
          cd scripts
          python run_pipeline.py --no-cg-detail
        env:
          PYTHONIOENCODING: utf-8
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}   # e-mail exigé par la SEC (suivi des ETF)

      - name: Commit et push des résultats
        run: |
          git config user.name  "crypto-bot"
          git config user.email "crypto-bot@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/augustinmaury-dev/crypto-screening.git
          # Ajoute uniquement ce qui existe (certains dossiers se créent après plusieurs jours)
          for f in scores.csv catalysts.json tvl.json score_history.json top_explosive.json scores_explosive.csv market_regime.json market_state.json dashboard.json; do
            [ -f "data/computed/$f" ] && git add "data/computed/$f" || true
          done
          [ -f report.md ] && git add report.md || true
          [ -d data/history ]  && git add data/history/  || true
          [ -d data/learning ] && git add data/learning/ || true
          git diff --staged --quiet || git commit -m "Pipeline $(date -u +%Y-%m-%d) — scores mis à jour"
          git push
